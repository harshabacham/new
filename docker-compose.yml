version: '3.8'

services:
  # Streamlit Interactive Tactical Command Dashboard
  dashboard:
    build: .
    container_name: sih26184_dashboard
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  # High-Throughput REST API Microservice
  api:
    build: .
    container_name: sih26184_api
    ports:
      - "8000:8000"
    command: ["python", "api.py"]
    restart: unless-stopped
